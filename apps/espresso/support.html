<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お問い合わせ | Espresso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
            background: #f8f5f2;
            color: #3e3028;
            line-height: 1.7;
        }

        header {
            background: #4b3428;
            color: white;
            padding: 22px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
            color: #4b3428;
        }

        p {
            color: #665850;
        }

        .contact-box {
            margin-top: 28px;
            padding: 22px;
            background: #f8f5f2;
            border-radius: 12px;
            text-align: center;
        }

        .contact-label {
            margin: 0 0 10px;
            font-size: 14px;
            color: #776b64;
        }

        .email {
            display: inline-block;
            color: #6d4c41;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        .email:hover {
            text-decoration: underline;
        }

        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #776b64;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 28px;
            color: #6d4c41;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 13px;
            color: #80756f;
        }

        @media (max-width: 600px) {
            main {
                margin: 25px auto;
            }

            .card {
                padding: 24px 18px;
            }

            header h1 {
                font-size: 21px;
            }

            .email {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>お問い合わせ</h1>
</header>

<main>

    <div class="card">

        <h2>お問い合わせ</h2>

        <p>
            Make Cremaに関するご質問、不具合の報告、
            ご意見・ご要望などがございましたら、下記のメールアドレスまで
            お問い合わせください。
        </p>

        <div class="contact-box">

            <p class="contact-label">
                お問い合わせ先
            </p>

            <a
                class="email"
                href="mailto:koohii2424@gmail.com"
            >
                koohii2424@gmail.com
            </a>

            <p class="note">
                メールアドレスをタップすると、
                メール作成画面が開きます。
            </p>

        </div>

        <a class="back-link" href="/index.html">
            ← トップページに戻る
        </a>

    </div>

</main>

<footer>
    © Make Crema
</footer>

</body>
</html>
